name: Test, Build and Deploy | Modul 01 - Lab2.2 Senior Project
# This workflow will test, build and deploy the project to the VM server.

on:
  push:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - uses: actions/checkout@v4
      - name: Testing Build pre-Deploy
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm i
      - run: npm run build
  
  deploy:
    needs: test-build
    runs-on: ubuntu-latest

    steps:
      - name: Build app on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}

          script: |
            echo "Cek folder project"

            PROJECT_DIR="${HOME}/senpro/537712/modul02/senpro-github-action-fork-izzy"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Repository belum ada. Cloning..."

              mkdir -p "${HOME}/senpro/537712/modul02"
              cd "${HOME}/senpro/537712/modul02"

              git clone https://github.com/muhizzy123-png/senpro-github-action-fork-izzy.git

            else
              echo "Repository sudah ada. Updating..."

              cd "$PROJECT_DIR"

              git restore .
              git pull origin main
            fi

            echo "Masuk ke folder project..."
            cd "$PROJECT_DIR"

            echo "Install Package..."
            npm install

            echo "Build Project..."
            npm run build

            echo "Build selesai!"